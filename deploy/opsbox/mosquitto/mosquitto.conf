# Mosquitto: the MQTT broker that home devices and adapters publish to.
#
# MQTT is the "last mile" protocol: tiny, push-based, and what most home
# gear speaks. It keeps no history, so the bridge copies what matters into
# Redpanda, which does.

listener 1883

# Every client needs a username and password, and the ACL file says which
# topics each user may read or write. This matters more here than on the
# Kafka side: ring-mqtt also listens for COMMANDS over MQTT (arm, disarm,
# unlock), so whoever can publish to ring/# can control the house.
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Keep subscriptions and queued messages on disk. The bridge connects with
# a persistent session, so events that arrive while the bridge is down are
# held here and delivered when it comes back, even across a Mosquitto
# restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
