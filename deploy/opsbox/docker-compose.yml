# Always-on home event hub for a homelab box, reachable from the LAN:
#
#   Ring cloud -> ring-mqtt -> Mosquitto (MQTT) -> ring-bridge -> Redpanda
#
# Redpanda + Console are the Kafka side and are all the learning stages in
# this repo need. The other three services feed real home events into it.
#
# This is a separate deployment from the repo-root docker-compose.yml, which
# stays the laptop-only setup (everything on localhost). Differences here:
#   - the broker advertises this machine's LAN address, so other machines
#     on the network can connect
#   - containers restart on their own after a crash or a reboot
#   - memory is capped so the broker can't crowd out the rest of the box
#
#   cp .env.example .env          then set the address and passwords
#   docker compose up -d          start (or apply changes)
#   docker compose ps             redpanda should show "healthy"
#   docker compose down           stop, keep the data
#
# See README.md in this folder for how to connect from another machine.

name: event-hub

# Cap container logs so a chatty service can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.16
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      # LISTENERS, the part that makes LAN access work.
      #
      # --kafka-addr is where the broker *listens* (a socket inside the
      # container). --advertise-kafka-addr is the address the broker *hands
      # out to clients*. A Kafka client connects in two steps:
      #
      #   1. It opens a connection to the bootstrap address you gave it and
      #      asks "which brokers exist, and who leads each partition?"
      #   2. The broker answers with its ADVERTISED address, and the client
      #      drops the bootstrap connection and reconnects to that address
      #      for all real work.
      #
      # So the advertised address has to be one the client can reach from
      # where the client is running. "localhost" only works for a client on
      # the same machine: from a laptop, step 1 would succeed and step 2
      # would send the laptop to its own localhost, where nothing listens.
      #
      # That's why there are two listeners, each advertising a different
      # address for a different audience:
      #   internal -> redpanda:9092             other containers (Console)
      #   external -> <this host's LAN address>:19092   everything else
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${REDPANDA_ADVERTISED_HOST:?copy .env.example to .env and set REDPANDA_ADVERTISED_HOST}:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # Dev-container mode: relaxed fsync and no CPU pinning. Fine for
      # learning and low-stakes home events; a hard power loss can drop the
      # last few seconds of writes. Revisit before anything depends on it.
      - --mode dev-container
      - --smp 1
      # Without --memory the broker sizes itself to the whole machine.
      - --memory 1G
      - --reserve-memory 0M
      - --default-log-level=info
    # Backstop above the broker's own 1G budget (it needs a little extra
    # outside that for rpk and startup).
    mem_limit: 1536m
    ports:
      # The 0.0.0.0 prefix publishes on IPv4 only. Without it Docker also
      # binds IPv6, and a box with a public IPv6 address would be offering
      # an unauthenticated broker to whatever the router lets through.
      - "0.0.0.0:19092:19092" # Kafka API (use this from your code)
      - "0.0.0.0:18081:18081" # Schema Registry (used in later stages)
      - "0.0.0.0:9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  console:
    # Web UI: http://<this host's LAN address>:8080
    # It talks to the broker over the internal listener, so it never needs
    # the LAN address.
    image: docker.redpanda.com/redpandadata/console:v3.13.0
    container_name: redpanda-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    mem_limit: 512m
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  hub-topics:
    # One-shot: creates the home.ring.* topics, then exits. See
    # create-topics.sh for the list and the reasoning behind it.
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.16
    container_name: hub-topics
    restart: "no"
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    volumes:
      - ./create-topics.sh:/create-topics.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy

  mosquitto:
    # MQTT broker. Home devices and adapters publish here; see
    # mosquitto/mosquitto.conf and mosquitto/acl.
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    # start.sh builds the password file from the variables below, then
    # starts the broker.
    command: ["/bin/sh", "/hub/start.sh"]
    environment:
      MQTT_RING_PASSWORD: ${MQTT_RING_PASSWORD:?set MQTT_RING_PASSWORD in .env}
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?set MQTT_BRIDGE_PASSWORD in .env}
      MQTT_VIEWER_PASSWORD: ${MQTT_VIEWER_PASSWORD:?set MQTT_VIEWER_PASSWORD in .env}
    mem_limit: 128m
    ports:
      - "0.0.0.0:1883:1883" # MQTT, password required
    volumes:
      - ./mosquitto:/hub:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # Succeeds once something is listening on the MQTT port.
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 1883 </dev/null"]
      # Check quickly while starting, then once a minute: every check shows
      # up in Mosquitto's log as a client connecting and leaving.
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    logging: *logging

  ring-mqtt:
    # https://github.com/tsightler/ring-mqtt
    # Holds a connection to Ring's cloud and republishes device events
    # (motion, dings, door sensors, alarm state, battery) as MQTT messages
    # under ring/#.
    #
    # First run: it has no Ring login yet, so it serves a sign-in page on
    # port 55123 and waits. After you sign in there it saves a token to its
    # data volume, connects, and closes that page again.
    image: tsightler/ring-mqtt:5.9.3
    container_name: ring-mqtt
    restart: unless-stopped
    environment:
      MQTT_RING_PASSWORD: ${MQTT_RING_PASSWORD:?set MQTT_RING_PASSWORD in .env}
    mem_limit: 512m
    ports:
      - "0.0.0.0:55123:55123" # Ring sign-in page (only up until signed in)
    volumes:
      # The Ring token lives in this volume. It grants full access to the
      # Ring account, so it stays out of the repo folder.
      - ring-mqtt-data:/data
      # Writes /data/config.json from the environment before startup.
      - ./ring-mqtt/05-write-config.sh:/etc/cont-init.d/05-write-config.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    logging: *logging

  ring-bridge:
    # Redpanda Connect: subscribes to ring/# on Mosquitto and produces to
    # the home.ring.* topics. The whole pipeline is connect/ring-bridge.yaml.
    image: docker.redpanda.com/redpandadata/connect:4.118.0
    container_name: ring-bridge
    restart: unless-stopped
    command: ["run", "--disable-telemetry", "/connect/ring-bridge.yaml"]
    environment:
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?set MQTT_BRIDGE_PASSWORD in .env}
    mem_limit: 256m
    volumes:
      - ./connect:/connect:ro
    depends_on:
      redpanda:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      hub-topics:
        condition: service_completed_successfully
    logging: *logging

  ntfy:
    # https://ntfy.sh, self-hosted: turns an HTTP POST into a push
    # notification on a phone. Nothing in the hub publishes to it yet; it is
    # here for a consumer that reads home.ring.* topics and posts an alert
    # when a door opens or the doorbell rings.
    #
    # Web page and API: http://<this host's address>:2586
    # Accounts and permissions: ntfy/create-users.sh
    image: binwiederhier/ntfy:v2.37.2
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      # Messages are kept on disk this long, so a phone that was out of
      # reach catches up when it reconnects. The default is 12h.
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      # Accounts live in this file. With deny-all, a topic is closed to
      # everyone, signed in or not, unless create-users.sh grants access.
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # The web page asks for a login instead of showing an empty app.
      NTFY_ENABLE_LOGIN: "true"
      NTFY_REQUIRE_LOGIN: "true"
      # The address people and phones use to reach this server. Leave it
      # empty in .env if you only ever use the port below directly.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      # ntfy limits requests and failed logins per client address. Behind a
      # reverse proxy every request arrives from the proxy, so read the
      # real client from X-Forwarded-For, skipping addresses on Docker's
      # own networks (the proxy's side of the tunnel). A client that talks
      # to port 2586 directly can fake this header, which only matters if
      # you don't trust your LAN.
      NTFY_BEHIND_PROXY: "true"
      NTFY_PROXY_TRUSTED_HOSTS: 172.16.0.0/12
      NTFY_LOG_LEVEL: ${NTFY_LOG_LEVEL:-info}
    mem_limit: 128m
    ports:
      - "0.0.0.0:2586:80" # HTTP, login required
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    logging: *logging

  ntfy-users:
    # One-shot: creates the ntfy accounts from .env, then exits. It works
    # on the same account file as the server through the shared volume.
    image: binwiederhier/ntfy:v2.37.2
    container_name: ntfy-users
    restart: "no"
    entrypoint: ["/bin/sh", "/hub/create-users.sh"]
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # Only so the permission list this prints matches the server's.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_PUBLISHER_PASSWORD: ${NTFY_PUBLISHER_PASSWORD:?set NTFY_PUBLISHER_PASSWORD in .env}
      NTFY_PHONE_PASSWORD: ${NTFY_PHONE_PASSWORD:?set NTFY_PHONE_PASSWORD in .env}
    volumes:
      - ./ntfy:/hub:ro
      - ntfy-auth:/var/lib/ntfy
    depends_on:
      ntfy:
        condition: service_healthy

  ring-alerts:
    # The first consumer of the home.ring.* topics: sends a phone alert
    # through ntfy when a door or window opens or closes, or a camera sees
    # motion. The code is services/python/home/consumers/ring_alerts.py and the two
    # helpers next to it.
    #
    # After changing the code:  docker compose up -d --build ring-alerts
    build: ../../services/python
    image: event-hub/python-services
    container_name: ring-alerts
    restart: unless-stopped
    command: ["python", "-m", "home.consumers.ring_alerts"]
    environment:
      # Container to container, so the internal listener and ntfy's own
      # port, not the LAN address.
      BOOTSTRAP_SERVERS: redpanda:9092
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: home-alerts
      NTFY_USER: hub-publisher
      NTFY_PASSWORD: ${NTFY_PUBLISHER_PASSWORD:?set NTFY_PUBLISHER_PASSWORD in .env}
    mem_limit: 128m
    depends_on:
      redpanda:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    logging: *logging

  mining-watch:
    # Watches the solo mining pool on the Pi and publishes an event when a
    # miner sets a new best share or the pool finds a block. Written in
    # Rust: services/rust/home/publishers/mining_watch.
    #
    #   best shares  read from ckpool's stats files every ten minutes
    #   blocks       heard from Bitcoin Core's block announcements (ZeroMQ)
    #
    # Nothing runs on the Pi for this: the container logs in over SSH to
    # read the files, and keeps an SSH tunnel open to hear the announcements.
    #
    # After changing the code:  docker compose up -d --build mining-watch
    build: ../../services/rust/home
    image: event-hub/rust-services
    container_name: mining-watch
    restart: unless-stopped
    command: ["mining_watch"]
    # ssh refuses to run as a user that has no entry in /etc/passwd, and
    # the key file is readable only by its owner on the host. Root inside
    # the container is the simple way to satisfy both.
    user: root
    # A tiny init process, so the ssh processes are cleaned up properly
    # when they end.
    init: true
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      CKPOOL_SSH: ${CKPOOL_SSH:-}
      CKPOOL_SSH_KEY: /ssh/id
      CKPOOL_KNOWN_HOSTS: /ssh/known_hosts
      # A block is ours when its reward pays this address.
      POOL_ADDRESS: ${POOL_ADDRESS:-}
    volumes:
      - ${CKPOOL_SSH_KEY:-/dev/null}:/ssh/id:ro
      - ${CKPOOL_KNOWN_HOSTS:-/dev/null}:/ssh/known_hosts:ro
    mem_limit: 64m
    depends_on:
      redpanda:
        condition: service_healthy
      hub-topics:
        condition: service_completed_successfully
    logging: *logging

  mining-alerts:
    # Turns the home.mining.* events into phone alerts, the same way
    # ring-alerts does for doors. Written in Rust:
    # services/rust/home/consumers/mining_alerts.
    build: ../../services/rust/home
    image: event-hub/rust-services
    container_name: mining-alerts
    restart: unless-stopped
    command: ["mining_alerts"]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: home-alerts
      NTFY_USER: hub-publisher
      NTFY_PASSWORD: ${NTFY_PUBLISHER_PASSWORD:?set NTFY_PUBLISHER_PASSWORD in .env}
    mem_limit: 64m
    depends_on:
      redpanda:
        condition: service_healthy
      ntfy:
        condition: service_healthy
      hub-topics:
        condition: service_completed_successfully
    logging: *logging

volumes:
  redpanda-data:
  mosquitto-data:
  ring-mqtt-data:
  ntfy-cache:
  ntfy-auth:
