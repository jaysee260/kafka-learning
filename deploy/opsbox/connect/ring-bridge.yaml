# Redpanda Connect pipeline: Ring events from MQTT into Redpanda topics.
#
#   Mosquitto (MQTT)  --->  this bridge  --->  Redpanda (Kafka API)
#
#   ring/<location>/<category>/<device>/<entity>/state
#                                 -> home.ring.<kind>     one event per change
#   homeassistant/sensor/<location>/<device>_info/config
#                                 -> home.ring.devices    one record per device
#
# Every record's key is the Ring device id.
#
# A Connect pipeline is three parts: an input, a list of processors that
# each message passes through, and an output. Tests for the processors are
# in ring-bridge_benthos_test.yaml next to this file.

input:
  mqtt:
    urls: [tcp://mosquitto:1883]
    user: bridge
    password: ${MQTT_BRIDGE_PASSWORD}

    # A fixed client id plus clean_session: false is a "persistent
    # session". Mosquitto remembers this client's subscriptions and queues
    # matching QoS 1 messages while the bridge is offline, so a bridge
    # restart doesn't lose events.
    client_id: ring-bridge
    clean_session: false
    qos: 1

    # The subscription is the allowlist. ring-mqtt publishes much more
    # (camera snapshots as JPEGs, volume settings, stream state); anything
    # not listed here never reaches the bridge.
    #   + matches exactly one topic level: location, category, device.
    topics:
      - ring/+/+/+/motion/state   # cameras, doorbells, alarm motion sensors
      - ring/+/+/+/ding/state     # doorbell button
      - ring/+/+/+/contact/state  # door and window sensors
      - ring/+/+/+/zone/state     # tilt sensors, retrofit zones
      - ring/+/+/+/alarm/state    # alarm panel: disarmed, armed_home, triggered...
      - ring/+/+/+/mode/state     # location mode, for homes without an alarm
      - ring/+/+/+/siren/state
      - ring/+/+/+/police/state
      - ring/+/+/+/fire/state
      - ring/+/+/+/smoke/state
      - ring/+/+/+/co/state
      - ring/+/+/+/flood/state
      - ring/+/+/+/freeze/state
      - ring/+/+/+/info/state     # device info JSON, the source of battery readings

      # ring-mqtt describes each device (name, model) in the format Home
      # Assistant uses to discover devices. It sends one such message per
      # sensor; the "info" sensor exists on every device, so that one is
      # used as the device's description and the rest are ignored.
      - homeassistant/sensor/+/+/config

pipeline:
  # One message at a time, start to finish. Kafka keeps the order of
  # messages within a partition, but only the order they were PRODUCED in,
  # so the bridge must not shuffle a device's ON and OFF on the way
  # through. At home volumes there is nothing to gain from parallelism.
  threads: 1

  processors:
    # `try` runs its processors in order and skips the rest once one fails.
    - try:
        # Step 1: decide where the message goes, from its MQTT topic alone.
        # This is kept separate from step 2 so that if step 2 fails, the
        # routing decision is already made and the message can still be
        # sent to the right dead-letter topic.
        - mapping: |
            let parts = @mqtt_topic.split("/")
            let is_device = $parts.index(0) == "homeassistant"

            # Entity -> kind, for messages under ring/.
            let kinds = {
              "motion":  "motion",
              "ding":    "ding",
              "contact": "contact",
              "zone":    "contact",
              "alarm":   "alarm",
              "mode":    "alarm",
              "siren":   "alarm",
              "police":  "alarm",
              "fire":    "alarm",
              "smoke":   "alarm",
              "co":      "alarm",
              "flood":   "alarm",
              "freeze":  "alarm",
              "info":    "battery"
            }
            let kind = if $is_device {
              if $parts.index(3).has_suffix("_info") { "devices" } else { "" }
            } else {
              $kinds.get($parts.index(4)).or("")
            }
            root = if $kind == "" { deleted() }

            meta kind        = $kind
            meta kafka_topic = "home.ring." + $kind
            meta location_id = if $is_device { $parts.index(2) } else { $parts.index(1) }
            meta device_id   = if $is_device { $parts.index(3).trim_suffix("_info") } else { $parts.index(3) }
            meta category    = if !$is_device { $parts.index(2) }
            meta entity      = if !$is_device { $parts.index(4) }

        # Step 2: build the record. ring-mqtt sends bare text ("ON",
        # "armed_home"), which means nothing once it is separated from its
        # MQTT topic, so events get a common envelope that carries the
        # context along.
        #
        # This step also computes a "fingerprint": the part of the message
        # that has to change for it to count as news. Step 3 uses it.
        - mapping: |
            let raw = content().string()

            # Battery and device messages are JSON. Payloads that are not
            # valid JSON fail here and go to the DLQ.
            let doc = if @kind == "battery" || @kind == "devices" { $raw.parse_json() }

            let event = {
              "event_id":    uuid_v4(),
              "source":      "ring",
              "kind":        @kind,
              "device_id":   @device_id,
              "location_id": @location_id,
              "category":    @category,
              "entity":      @entity,
              "observed_at": now()
            }

            root = match {
              @kind == "devices" => {
                "device_id":    @device_id,
                "source":       "ring",
                "name":         $doc.device.name.not_null(),
                "model":        $doc.device.mdl,
                "manufacturer": $doc.device.mf,
                "location_id":  @location_id,
                # The device's own MQTT topic says whether it is a camera
                # or an alarm device: ring/<location>/<category>/...
                "category":     $doc.state_topic.split("/").index(2),
                "updated_at":   now()
              }
              # Mains-powered devices report info with no battery fields.
              @kind == "battery" && $doc.batteryLevel == null && $doc.batteryStatus == null => deleted()
              @kind == "battery" => $event.merge({
                "battery_level":  $doc.batteryLevel,
                "battery_status": $doc.batteryStatus
              })
              $raw == "" => throw("empty payload")
              _ => $event.merge({ "state": $raw })
            }

            meta fingerprint = match {
              @kind == "devices" => "%v|%v".format($doc.device.name, $doc.device.mdl)
              @kind == "battery" => "%v|%v".format($doc.batteryLevel, $doc.batteryStatus)
              _ => $raw
            }

        # Step 3: only pass on changes.
        #
        # ring-mqtt publishes STATE, not events: it was built for Home
        # Assistant, where hearing "the door is closed" six times is
        # harmless. It resends everything several times after it starts,
        # and resends device info every five minutes. An event log should
        # say "the door closed" once, so the bridge remembers the last
        # fingerprint it forwarded for each MQTT topic and drops a message
        # that matches it.
        #
        # `branch` runs the lookup on a copy of the message, then
        # result_map copies just the answer back as metadata, leaving the
        # record built in step 2 untouched.
        - branch:
            request_map: root = ""
            processors:
              - label: lookup_last_forwarded
                cache:
                  resource: last_forwarded
                  operator: get
                  key: ${! @mqtt_topic }
              # A key that isn't in the cache yet is reported as an error;
              # here it just means "never seen", so turn it into empty.
              - catch:
                  - mapping: root = ""
            result_map: meta last_fingerprint = content().string()

        - mapping: |
            root = if @last_fingerprint == @fingerprint { deleted() }

    # `catch` only runs for messages that failed above. Instead of dropping
    # them or blocking the pipeline, send the untouched original payload to
    # the topic's dead-letter partner, with the reason in a header.
    - catch:
        - mapping: |
            meta bridge_error = error()
            # Step 1 cannot fail for the topics subscribed above; the
            # fallback only exists so a routing bug still lands somewhere.
            meta kafka_topic = @kafka_topic.or("home.ring.alarm") + ".dlq"
            # Dead letters are never remembered as "forwarded".
            meta fingerprint = deleted()

output:
  # Two outputs, strictly in order: write to Redpanda, and only once that
  # has succeeded, remember the fingerprint. Doing it the other way round
  # would lose an event whenever a write failed and was retried, because
  # the retry would look like a repeat.
  broker:
    pattern: fan_out_sequential
    outputs:
      - redpanda:
          # The broker's internal listener: this container is on the same
          # Docker network, so it uses the container name, not the LAN
          # address.
          seed_brokers: [redpanda:9092]
          topic: ${! @kafka_topic }

          # All of one device's records share a key, so they land in one
          # partition and stay in order relative to each other.
          key: ${! @device_id }

          # Copied onto each record as Kafka headers.
          metadata:
            include_patterns: ["^mqtt_topic$", "^bridge_error$"]

          # Topics are created on purpose by create-topics.sh. A typo here
          # should fail loudly, not quietly make a new one-partition topic.
          allow_auto_topic_creation: false
          max_in_flight: 1

      - switch:
          cases:
            - check: '@fingerprint != null'
              output:
                cache:
                  target: last_forwarded
                  key: ${! @mqtt_topic }
                  max_in_flight: 1
                processors:
                  - mapping: root = @fingerprint
            - output:
                drop: {}

cache_resources:
  # Held in memory, so it starts empty when the bridge restarts. The
  # visible effect: after a bridge restart, each device's current state
  # comes through once more as it is next published.
  - label: last_forwarded
    lru:
      cap: 10000
