# The Rust versions of the shop services. One package holds:
#   src/lib.rs  ... shared code (config, events, consume loop), imported as `shop::...`
#   src/bin/*.rs .. one program per service; run one with `cargo run --bin <name>`
[package]
name = "shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
# Kafka client: Rust bindings for librdkafka (built from source on first build).
rdkafka = "0.39.0"
# Async runtime: lets a service wait on "next message" and "Ctrl+C" at once.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
# JSON <-> Rust structs.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Fake order data: random picks, order ids, timestamps.
rand = "0.10.3"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
# Command-line flags for the producer (--rate, --count).
clap = { version = "4.6.7", features = ["derive"] }
