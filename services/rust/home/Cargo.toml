# The home event hub's Rust services. One package holds:
#   src/bin/*.rs .. one program per service, short enough to read top to bottom
#   src/*.rs ...... the plumbing they share, imported as `home::...`
[package]
name = "home"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
# Kafka client: Rust bindings for librdkafka (built from source on first build).
rdkafka = "0.39"
# Async runtime: lets a service wait on several things at once.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync"] }
# JSON <-> Rust types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Errors with a sentence of context, instead of one type per kind of error.
anyhow = "1"
# Picking "Solved and confirmed block ..." lines out of ckpool's log.
regex = "1"
# Bitcoin Core announces new blocks over ZeroMQ.
zmq = "0.10"
# Reading a raw block: its height and who its reward pays.
bitcoin = "0.32"
# HTTP client, for posting alerts to ntfy.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
